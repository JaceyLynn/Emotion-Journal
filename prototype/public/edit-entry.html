<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: linear-gradient(145deg, #40975D 0%, #00444d 80%, #00444d 100%);
            min-height: 100vh;
            padding: 0;
            padding-bottom: 60px;
            position: relative;
        }

        .back-arrow {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            z-index: 100;
        }

        .back-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .back-arrow::before {
            content: '←';
            color: white;
            font-size: 1.8rem;
            font-weight: 300;
        }

        .edit-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 30px 30px 30px;
        }

        h1 {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 300;
            resize: vertical;
            min-height: 150px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #40975D;
            background: rgba(255, 255, 255, 0.2);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #40975D;
            background: rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #00444d;
            color: white;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .emoji-option {
            font-size: 2rem;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .emoji-option:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .emoji-option.selected {
            background: rgba(64, 151, 93, 0.3);
            border-color: #40975D;
        }

        .color-wheel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .button-row {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: row;
            gap: 0;
            margin: 0;
            z-index: 100;
        }

        button {
            padding: 15px 20px;
            border: none;
            font-size: 1rem;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .delete-btn {
            background: #333;
            color: white;
            width: 50%;
            height: 45px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            text-decoration: line-through;
            border-radius: 0;
        }

        .delete-btn:hover {
            background: #cd4137;
        }

        .save-reflection-btn {
            background: #333;
            color: white;
            width: 50%;
            height: 45px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border-radius: 0;
        }

        .save-reflection-btn:hover {
            background: #00444d;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        @media (max-width: 768px) {
            .back-arrow {
                top: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
            }

            .back-arrow::before {
                font-size: 1.5rem;
            }

            .edit-container {
                padding: 25px;
                margin-top: 40px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .emoji-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .color-wheel {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <button class="back-arrow" id="back-arrow"></button>
    
    <div class="edit-container">
        <h1 id="entry-time">Loading...</h1>
        
        <div class="input-group">
            <label>Event</label>
            <p id="event-description" style="color: rgba(255, 255, 255, 0.9); font-size: 1rem; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; margin: 0;">Loading...</p>
        </div>

        <div class="input-group">
            <label>Your thoughts and feelings</label>
            <div id="feeling-input" style="color: rgba(255, 255, 255, 0.9); font-size: 1rem; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.3); min-height: 150px; white-space: pre-wrap; word-wrap: break-word;">Loading...</div>
        </div>

        <div class="input-group">
            <label>Emotion</label>
            <p id="emotion-category" style="color: rgba(255, 255, 255, 0.9); font-size: 1rem; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; margin: 0; text-transform: capitalize;">Loading...</p>
        </div>

        <div class="input-group" style="border-top: 2px solid rgba(255, 255, 255, 0.2); padding-top: 30px; margin-top: 30px;">
            <label for="updated-mood">How do you feel about it now?</label>
            <select id="updated-mood">
                <option value="">Select current feeling...</option>
            </select>
        </div>

        <div class="input-group">
            <label for="reflection-input">Add reflection</label>
            <textarea 
                id="reflection-input" 
                placeholder="Looking back, what insights do you have?"
                rows="4"
            ></textarea>
        </div>

        <div class="button-row">
            <button id="save-reflection-btn" class="save-reflection-btn">SAVE UPDATES</button>
            <button id="delete-btn" class="delete-btn">DELETE</button>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-content">
            <p>Processing...</p>
        </div>
    </div>

    <div id="delete-confirmation" class="loading-overlay hidden">
        <div class="loading-content">
            <p style="margin-bottom: 20px; font-size: 1.1rem;">Delete this entry?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="confirm-delete-btn" style="background: #F44336; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Yes, Delete</button>
                <button id="cancel-delete-btn" style="background: rgba(255,255,255,0.2); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="edit-entry.js"></script>
</body>
</html>
